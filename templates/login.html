<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💊 FarmaData — Iniciar sesión</title>
    <script>
    (function() {
        const tema = localStorage.getItem('tema') || 'light';
        document.documentElement.setAttribute('data-theme', tema);
    })();
</script>   
    <style>
        [data-theme="light"] {
            --bg: #f0f4f8; --card: #ffffff; --text: #2d3748; --text-soft: #718096;
            --border: #e2e8f0; --primary: #2b6cb0; --input-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg: #0f1117; --card: #1a1d27; --text: #e2e8f0; --text-soft: #94a3b8;
            --border: #2d3748; --primary: #3b82f6; --input-bg: #252836;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body {
            background: var(--bg); color: var(--text);
            min-height: 100vh; display:flex; align-items:center; justify-content:center;
        }
        .login-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 35px; width: 100%; max-width: 380px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .login-card .logo { text-align:center; font-size:2.5rem; margin-bottom:5px; }
        .login-card h1 { text-align:center; color: var(--primary); font-size:1.4rem; margin-bottom:5px; }
        .login-card p.subtitulo { text-align:center; color: var(--text-soft); font-size:0.85rem; margin-bottom:25px; }
        .form-group { margin-bottom:16px; }
        label { display:block; margin-bottom:5px; font-weight:600; font-size:0.9rem; }
        input {
            width:100%; padding:10px 12px; border:1px solid var(--border);
            border-radius:8px; background:var(--input-bg); color:var(--text); font-size:0.95rem;
        }
        input:focus { outline:none; border-color: var(--primary); }
        button {
            width:100%; padding:11px; border:none; border-radius:8px;
            background: var(--primary); color:white; font-weight:600;
            font-size:0.95rem; cursor:pointer; margin-top:8px;
        }
        button:hover { opacity:0.9; }
        .mensaje {
            background:#fed7d7; color:#c53030; padding:10px 14px;
            border-radius:8px; font-size:0.85rem; margin-bottom:16px; text-align:center;
        }
        .demo-info {
            margin-top:20px; padding:12px; background: var(--bg);
            border-radius:8px; font-size:0.78rem; color: var(--text-soft); text-align:center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">💊</div>
        <h1>FarmaData</h1>
        <p class="subtitulo">Sistema de Gestión Farmacéutica</p>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                {% for m in mensajes %}
                    <div class="mensaje">{{ m }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Iniciar sesión</button>
        </form>

        <div class="demo-info">
            👑 Admin: <strong>admin</strong> / admin123<br>
            🧑‍💼 Cajero: <strong>cajero</strong> / cajero123
        </div>
    </div>
</body>
</html>
